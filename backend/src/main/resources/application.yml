spring:
  application:
   name: Backend

  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
        timeout: 5m
        max-retries: 0
      chat:
        options:
          model: speakleash/bielik-11b-v2.3-instruct:Q4_K_M
    vectorstore:
      qdrant:
        host: localhost
        port: 6333
        collection-name: chatbot_vectors
        initialize-schema: true
  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: 8080
  address: localhost
