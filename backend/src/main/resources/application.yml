spring:
  application:
   name: Backend
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
        timeout: 5m
        max-retries: 0
      chat:
        options:
          model: SpeakLeash/bielik-11b-v2.3-instruct:Q4_K_M
          temperature: 0.4
          top_p: 0.2
      embedding:
        model: mxbai-embed-large:335m
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: chatbot_vectors
        initialize-schema: true
  data:
    mongodb:
      uri: mongodb://root:rootpassword@localhost:27017/chatbotdb?authSource=admin


server:
  port: 8080
  address: localhost