spring:
  application:
   name: Backend
#  autoconfigure:
#    exclude: org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
        timeout: 5m
        max-retries: 0
      chat:
        options:
          model: SpeakLeash/bielik-4.5b-v3.0-instruct:Q8_0
          temperature: 0.20
          top_p: 0.9
      embedding:
        model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: chatbot_vectors
        initialize-schema: true
  data:
    mongodb:
      uri: mongodb://root:rootpassword@localhost:27017/chatbotdb?authSource=admin


server:
  port: 8080
  address: localhost
